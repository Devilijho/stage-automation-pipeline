[project]
name = "stagebot"
version = "0.2.0"
description = "Local, grounded internship application pipeline for StageBot"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4",
    "playwright",
    "pypdf",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
