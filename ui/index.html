<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StageBot</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --amber: #d29922; --red: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  aside { width: 250px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .nav-btn { background: transparent; border: 1px solid transparent; color: var(--text); text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .nav-btn:hover, .nav-btn.active { background: #1f2937; border-color: var(--border); color: var(--accent); }
  .stats { margin-top: auto; background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--panel); }
  .content { flex: 1; overflow-y: auto; padding: 22px 24px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  button.primary { background: #238636; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button.secondary { background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-weight: 500; cursor: pointer; font-size: 13px; }
  button.primary:hover { background: #2ea043; }
  button.secondary:hover { border-color: var(--accent); }
  .lang-bar { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .lang-btn { background: var(--bg); color: var(--muted); border: none; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .lang-btn.active { background: #1f2937; color: var(--accent); }
  .pill-group { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .pill { background: var(--bg); color: var(--muted); border: 1px solid var(--border); padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .pill.active { background: rgba(88,166,255,.15); border-color: var(--accent); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--border); padding: 10px 8px; text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  pre.log { background: #010409; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 12px; height: 220px; overflow-y: auto; color: #c9d1d9; margin: 0; white-space: pre-wrap; }
  .pdf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; height: 72vh; }
  iframe.pdf { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .hidden { display: none; }
</style>
</head>
<body>
<aside>
  <div class="brand">StageBot</div>
  <div class="sub" id="sidebar-sub">Loading...</div>
  <button class="nav-btn active" id="nav-guide" onclick="showTab('guide', this)"></button>
  <button class="nav-btn" id="nav-fetch" onclick="showTab('fetch', this)"></button>
  <button class="nav-btn" id="nav-apply" onclick="showTab('apply', this)"></button>
  <button class="nav-btn" id="nav-tracker" onclick="showTab('tracker', this)"></button>
  <button class="nav-btn" id="nav-preview" onclick="showTab('preview', this)"></button>
  <button class="nav-btn" id="nav-profile" onclick="showTab('profile', this)"></button>
  <div class="stats" id="stats-box">
    <div><span id="lbl-total">Total</span>: <strong id="st-total">0</strong></div>
    <div><span id="lbl-applied">Sent</span>: <strong id="st-applied">0</strong></div>
    <div><span id="lbl-drafted">Drafts</span>: <strong id="st-drafted">0</strong></div>
    <div><span id="lbl-manual">Portal</span>: <strong id="st-manual">0</strong></div>
  </div>
</aside>

<main>
  <header>
    <div id="page-title" style="font-weight:600;"></div>
    <div class="row">
      <div class="lang-bar">
        <button class="lang-btn" id="lang-es" onclick="setLang('es')">ES</button>
        <button class="lang-btn" id="lang-fr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </header>

  <div class="content">
    <!-- TRACKER TAB -->
    <section id="tab-tracker" class="hidden">
      <div class="card row">
        <input id="filter-q" oninput="renderTable()" style="flex:1; min-width:220px;">
        <select id="filter-status" onchange="renderTable()">
          <option value="" id="opt-all"></option>
          <option value="drafted">drafted</option>
          <option value="applied">applied</option>
          <option value="manual_portal">manual_portal</option>
          <option value="skipped">skipped</option>
        </select>
        <button class="secondary" id="btn-refresh" onclick="loadApps()"></button>
        <a href="/api/report" target="_blank"><button class="secondary" id="btn-report"></button></a>
      </div>
      <div class="card" style="padding: 8px 16px;">
        <table>
          <thead>
            <tr>
              <th id="th-date"></th>
              <th id="th-source"></th>
              <th id="th-company"></th>
              <th id="th-role"></th>
              <th id="th-status"></th>
              <th id="th-docs"></th>
              <th id="th-actions"></th>
            </tr>
          </thead>
          <tbody id="apps-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- 2. FETCH OFFERS TAB -->
    <section id="tab-fetch" class="hidden">
      <div class="card">
        <h3 id="fetch-heading" style="margin-top:0; margin-bottom:6px;"></h3>
        <p id="fetch-desc" style="font-size:12px; color:var(--muted); margin-top:0; margin-bottom:14px;"></p>
        <div class="row" style="margin-bottom:12px;">
          <input id="q-input" value="" style="flex:1;">
          <select id="q-limit" style="width:110px;">
            <option value="5">5 offers</option>
            <option value="10" selected>10 offers</option>
            <option value="20">20 offers</option>
          </select>
        </div>
        <div class="row" style="margin-bottom:14px;">
          <div class="pill-group">
            <button class="pill active" id="pill-li" onclick="this.classList.toggle('active')">LinkedIn (Easy Apply)</button>
            <button class="pill" id="pill-hw" onclick="this.classList.toggle('active')">HelloWork</button>
          </div>
        </div>
        <button class="primary" id="btn-fetch" onclick="launchFetch()"></button>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between; margin-bottom:8px;">
          <strong id="lbl-logs-fetch"></strong>
          <div class="row">
            <span id="run-state-fetch" style="font-size:12px; color:var(--muted);"></span>
            <button class="secondary" onclick="stopTask()" style="padding:4px 10px; font-size:12px;">Stop</button>
          </div>
        </div>
        <pre class="log" id="live-log-fetch"></pre>
      </div>
    </section>

    <!-- 3. APPLY TAB -->
    <section id="tab-apply" class="hidden">
      <div class="card">
        <div class="row" style="justify-content:space-between; margin-bottom:12px;">
          <strong id="apply-mode-title"></strong>
          <div class="pill-group">
            <button class="pill active" id="mode-auto" onclick="setRunMode('auto')"><span id="lbl-m-auto"></span></button>
            <button class="pill" id="mode-apply" onclick="setRunMode('apply')"><span id="lbl-m-apply"></span></button>
            <button class="pill active" id="pill-skip" onclick="this.classList.toggle('active')"><span id="lbl-skip-ext"></span></button>
          </div>
        </div>
        <div class="row" style="gap:10px;">
          <button class="primary" id="btn-retry-drafted" onclick="runRetry('drafted')"></button>
          <button class="secondary" id="btn-retry-manual" onclick="runRetry('manual_portal')"></button>
          <button class="secondary" id="btn-mail" onclick="runMail()"></button>
        </div>
        <div id="apply-hint" style="font-size:12px; color:var(--muted); margin-top:10px;"></div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between; margin-bottom:8px;">
          <strong id="lbl-logs-apply"></strong>
          <div class="row">
            <span id="run-state-apply" style="font-size:12px; color:var(--muted);"></span>
            <button class="secondary" onclick="stopTask()" style="padding:4px 10px; font-size:12px;">Stop</button>
          </div>
        </div>
        <pre class="log" id="live-log-apply"></pre>
      </div>
    </section>

    <!-- PREVIEW TAB -->
    <section id="tab-preview" class="hidden">
      <div class="card row" style="justify-content:space-between;">
        <div id="preview-label" style="font-weight:600;"></div>
      </div>
      <div class="pdf-grid">
        <iframe class="pdf" id="pdf-cv"></iframe>
        <iframe class="pdf" id="pdf-lm"></iframe>
      </div>
    </section>

    <!-- PROFILE TAB -->
    <section id="tab-profile" class="hidden">
      <div class="card row" style="justify-content:space-between;">
        <div><strong id="lbl-master"></strong></div>
        <button class="primary" id="btn-sync" onclick="runSync()"></button>
      </div>
      <div class="card">
        <pre class="log" id="master-md" style="height:65vh;"></pre>
      </div>
    </section>

    <!-- GUIDE / TUTORIAL TAB -->
    <section id="tab-guide">
      <div class="card">
        <h3 id="g-title" style="margin-top:0;"></h3>
        <p id="g-intro" style="color:var(--muted); margin-bottom:0;"></p>
      </div>
      <div class="card">
        <h4 id="g-s1-t" style="margin-top:0;"></h4>
        <p id="g-s1-d" style="color:var(--muted);"></p>
        <div class="row">
          <button class="primary" id="g-s1-btn" onclick="runLogin(true)"></button>
          <span id="g-login-status" style="font-size:12px; color:var(--accent);"></span>
        </div>
      </div>
      <div class="card">
        <h4 id="g-s2-t" style="margin-top:0;"></h4>
        <p id="g-s2-d" style="color:var(--muted);"></p>
        <button class="secondary" id="g-s2-btn" onclick="runSync()"></button>
      </div>
      <div class="card">
        <h4 id="g-s3-t" style="margin-top:0;"></h4>
        <p id="g-s3-d" style="color:var(--muted);"></p>
        <button class="secondary" id="g-s3-btn" onclick="showTab('fetch', document.getElementById('nav-fetch'))"></button>
      </div>
      <div class="card">
        <h4 id="g-s4-t" style="margin-top:0;"></h4>
        <p id="g-s4-d" style="color:var(--muted);"></p>
        <button class="secondary" id="g-s4-btn" onclick="showTab('tracker', document.getElementById('nav-tracker'))"></button>
      </div>
      <div class="card">
        <h4 id="g-s5-t" style="margin-top:0;"></h4>
        <p id="g-s5-d" style="color:var(--muted);"></p>
        <a href="/api/report" target="_blank"><button class="secondary" id="g-s5-btn"></button></a>
      </div>
    </section>
  </div>
</main>

let currentLang = localStorage.getItem('stagebot_lang') || 'fr';
let currentTab = 'guide';
let runMode = 'auto';
let allRows = [];
let countsCache = {drafted: 0, manual_portal: 0};

function setRunMode(mode) {
  runMode = mode;
  ['auto', 'apply'].forEach(m => {
    document.getElementById('mode-' + m).classList.toggle('active', m === mode);
  });
}

function setLang(lang) {
  currentLang = I18N[lang] ? lang : 'fr';
  localStorage.setItem('stagebot_lang', currentLang);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('lang-' + currentLang).classList.add('active');
  const t = I18N[currentLang];
  document.getElementById('nav-guide').textContent = t.navGuide;
  document.getElementById('nav-fetch').textContent = t.navFetch;
  document.getElementById('nav-apply').textContent = t.navApply;
  document.getElementById('nav-tracker').textContent = t.navTracker;
  document.getElementById('nav-preview').textContent = t.navPreview;
  document.getElementById('nav-profile').textContent = t.navProfile;
  document.getElementById('lbl-total').textContent = t.total;
  document.getElementById('lbl-applied').textContent = t.applied;
  document.getElementById('lbl-drafted').textContent = t.drafted;
  document.getElementById('lbl-manual').textContent = t.manual;
  document.getElementById('btn-report').textContent = t.report;
  document.getElementById('btn-refresh').textContent = t.refresh;
  document.getElementById('filter-q').placeholder = t.filterPlaceholder;
  document.getElementById('opt-all').textContent = t.allStatuses;
  document.getElementById('th-date').textContent = t.thDate;
  document.getElementById('th-source').textContent = t.thSource;
  document.getElementById('th-company').textContent = t.thCompany;
  document.getElementById('th-role').textContent = t.thRole;
  document.getElementById('th-status').textContent = t.thStatus;
  document.getElementById('th-docs').textContent = t.thDocs;
  document.getElementById('th-actions').textContent = t.thActions;
  document.getElementById('fetch-heading').textContent = t.fetchHeading;
  document.getElementById('fetch-desc').textContent = t.fetchDesc;
  document.getElementById('btn-fetch').textContent = t.btnFetch;
  document.getElementById('apply-mode-title').textContent = t.applyModeTitle;
  document.getElementById('lbl-skip-ext').textContent = t.skipExternal;
  document.getElementById('lbl-m-auto').textContent = t.mAuto;
  document.getElementById('lbl-m-apply').textContent = t.mApply;
  document.getElementById('btn-mail').textContent = t.btnMail;
  document.getElementById('btn-retry-drafted').textContent = `${t.retryDrafted} (${countsCache.drafted || 0})`;
  document.getElementById('btn-retry-manual').textContent = `${t.retryManual} (${countsCache.manual_portal || 0})`;
  document.getElementById('apply-hint').textContent = t.applyHint;
  document.getElementById('lbl-logs-fetch').textContent = t.logs;
  document.getElementById('lbl-logs-apply').textContent = t.logs;
  document.getElementById('run-state-fetch').textContent = t.idle;
  document.getElementById('run-state-apply').textContent = t.idle;
  if (!document.getElementById('pdf-cv').src) {
    document.getElementById('preview-label').textContent = t.previewEmpty;
  }
  document.getElementById('lbl-master').textContent = t.masterTitle;
  document.getElementById('btn-sync').textContent = t.syncBtn;
  document.getElementById('g-title').textContent = t.gTitle;
  document.getElementById('g-intro').textContent = t.gIntro;
  document.getElementById('g-s1-t').textContent = t.gS1T;
  document.getElementById('g-s1-d').textContent = t.gS1D;
  document.getElementById('g-s1-btn').textContent = t.gS1Btn;
  document.getElementById('g-s2-t').textContent = t.gS2T;
  document.getElementById('g-s2-d').textContent = t.gS2D;
  document.getElementById('g-s2-btn').textContent = t.gS2Btn;
  document.getElementById('g-s3-t').textContent = t.gS3T;
  document.getElementById('g-s3-d').textContent = t.gS3D;
  document.getElementById('g-s3-btn').textContent = t.gS3Btn;
  document.getElementById('g-s4-t').textContent = t.gS4T;
  document.getElementById('g-s4-d').textContent = t.gS4D;
  document.getElementById('g-s4-btn').textContent = t.gS4Btn;
  document.getElementById('g-s5-t').textContent = t.gS5T;
  document.getElementById('g-s5-d').textContent = t.gS5D;
  document.getElementById('g-s5-btn').textContent = t.gS5Btn;
  document.getElementById('page-title').textContent = t.titles[currentTab] || 'StageBot';
  renderTable();
}

function showTab(name, btn) {
  currentTab = name;
  document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
  document.getElementById('tab-' + name).classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('page-title').textContent = I18N[currentLang].titles[name] || 'StageBot';
}

async function loadApps() {
  const res = await fetch('/api/applications');
  const data = await res.json();
  allRows = data.rows || [];
  document.getElementById('st-total').textContent = data.counts.total;
  document.getElementById('st-applied').textContent = data.counts.applied;
  document.getElementById('st-drafted').textContent = data.counts.drafted;
  document.getElementById('st-manual').textContent = data.counts.manual_portal;
  countsCache = data.counts;
  const t = I18N[currentLang];
  document.getElementById('btn-retry-drafted').textContent = `${t.retryDrafted} (${countsCache.drafted || 0})`;
  document.getElementById('btn-retry-manual').textContent = `${t.retryManual} (${countsCache.manual_portal || 0})`;
  renderTable();
}

function detectSource(url) {
  const u = (url || '').toLowerCase();
  if (u.startsWith('spontaneous://')) return 'Spontaneous';
  if (u.includes('linkedin.com')) return 'LinkedIn';
  if (u.includes('hellowork.com')) return 'HelloWork';
  if (u.includes('welcometothejungle.com')) return 'WTTJ';
  return 'Other';
}

function renderTable() {
  const t = I18N[currentLang];
  const q = document.getElementById('filter-q').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const tbody = document.getElementById('apps-tbody');
  tbody.innerHTML = '';
  for (const r of allRows) {
    if (st && r.Status !== st) continue;
    const src = detectSource(r.URL);
    const blob = `${src} ${r.Company} ${r.Role} ${r.Matched_Keywords}`.toLowerCase();
    if (q && !blob.includes(q)) continue;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color:var(--muted);white-space:nowrap;">${r.Date || ''}</td>
      <td><span style="font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);">${src}</span></td>
      <td><strong>${r.Company || ''}</strong></td>
      <td><a href="${r.URL}" target="_blank" style="color:var(--accent);text-decoration:none;">${r.Role || ''}</a></td>
      <td>
        <select onchange="changeStatus('${encodeURIComponent(r.URL)}', this.value)">
          ${['drafted','applied','manual_portal','skipped'].map(s => `<option value="${s}" ${r.Status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td><button class="secondary" onclick="previewDocs('${encodeURIComponent(r.Company || '')}','${encodeURIComponent(r.CV_PDF || '')}','${encodeURIComponent(r.LM_PDF || '')}')">${t.viewPdf}</button></td>
      <td><button class="secondary" onclick="openInChrome('${encodeURIComponent(r.CV_PDF || '')}','${encodeURIComponent(r.URL || '')}')">${t.applyBtn}</button></td>
    `;
    tbody.appendChild(tr);
  }
}

async function changeStatus(encodedUrl, status) {
  await fetch('/api/applications/status', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({url: decodeURIComponent(encodedUrl), status})
  });
  loadApps();
}

function previewDocs(companyEnc, cvEnc, lmEnc) {
  const company = decodeURIComponent(companyEnc);
  const cv = decodeURIComponent(cvEnc);
  const lm = decodeURIComponent(lmEnc);
  document.getElementById('preview-label').textContent = `${company}`;
  document.getElementById('pdf-cv').src = cv ? '/' + cv : '';
  document.getElementById('pdf-lm').src = lm ? '/' + lm : '';
  showTab('preview', document.getElementById('nav-preview'));
}

async function openInChrome(cvEnc, urlEnc) {
  const cv_pdf = decodeURIComponent(cvEnc);
  const url = decodeURIComponent(urlEnc);
  await fetch('/api/run', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'open', cv_pdf, url})
  });
  showTab('apply', document.getElementById('nav-apply'));
  pollLogs();
}

async function launchFetch() {
  const queries = document.getElementById('q-input').value.split(',').map(s=>s.trim()).filter(Boolean);
  const limit = parseInt(document.getElementById('q-limit').value || '10', 10);
  const sources = [];
  const liOn = document.getElementById('pill-li').classList.contains('active');
  const hwOn = document.getElementById('pill-hw').classList.contains('active');
  if (liOn) sources.push('linkedin');
  if (hwOn) sources.push('hellowork');
  if (!sources.length) sources.push('linkedin');
  await fetch('/api/run', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'search', limit, queries, sources, easy_apply: liOn})
  });
  pollLogs();
}

async function runRetry(retry_status) {
  const skip_external = retry_status === 'manual_portal' ? false : document.getElementById('pill-skip').classList.contains('active');
  await fetch('/api/run', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'retry', retry_status, limit: 200, auto: runMode === 'auto', skip_external})
  });
  pollLogs();
}

async function runMail() {
  await fetch('/api/run', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'mail', limit: 5})
  });
  pollLogs();
}

async function stopTask() {
  await fetch('/api/stop', {method:'POST'});
  pollLogs();
}

async function runLogin(stayOnGuide = false) {
  await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'login'})});
  if (stayOnGuide) {
    document.getElementById('g-login-status').textContent = I18N[currentLang].gLoginMsg;
  } else {
    showTab('guide', document.getElementById('nav-guide'));
    document.getElementById('g-login-status').textContent = I18N[currentLang].gLoginMsg;
  }
}

async function runSync() {
  await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'sync'})});
  showTab('fetch', document.getElementById('nav-fetch'));
  pollLogs();
}

let pollTimer = null;
async function pollLogs() {
  if (pollTimer) clearInterval(pollTimer);
  const t = I18N[currentLang];
  const tick = async () => {
    const res = await fetch('/api/logs');
    const data = await res.json();
    const txt = (data.lines || []).join('\n') || t.ready;
    for (const id of ['live-log-fetch', 'live-log-apply']) {
      const el = document.getElementById(id);
      if (el) { el.textContent = txt; el.scrollTop = el.scrollHeight; }
    }
    for (const id of ['run-state-fetch', 'run-state-apply']) {
      const st = document.getElementById(id);
      if (st) st.textContent = data.running ? t.running : t.done;
    }
    if (!data.running) {
      clearInterval(pollTimer);
      loadApps();
    }
  };
  await tick();
  pollTimer = setInterval(tick, 1200);
}

async function loadProfile() {
  const res = await fetch('/api/profile');
  const data = await res.json();
  document.getElementById('master-md').textContent = data.master_md || '';
  const p = data.profile || {};
  if (p.personal && p.personal.full_name) {
    document.title = `StageBot — ${p.personal.full_name}`;
  }
  if (p.education && p.internship) {
    document.getElementById('sidebar-sub').textContent = `${p.education.level} · ${p.internship.start_date} → ${p.internship.end_date}`;
  }
  if (p.search && Array.isArray(p.search.queries)) {
    document.getElementById('q-input').value = p.search.queries.join(', ');
  }
}

setLang(currentLang);
loadApps();
loadProfile();
</script>
